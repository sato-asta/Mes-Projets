<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishly — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
  --bg: #F6F6F8;
  --surface: #FFFFFF;
  --surface2: #EFEFF3;
  --border: #D9D9E0;
  --text: #141418;
  --text-2: #5E5E66;
  --text-3: #A4A4AE;
  --accent: #D64550;
  --accent-light: #FBE8EA;
  --amber: #E39A2F;
  --amber-light: #FFF2E1;
  --blue: #3A57D1;
  --blue-light: #E8ECFB;
}

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .auth-wrapper {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  }

  /* LEFT SIDE - ILLUSTRATION */
  .auth-left {
    background: linear-gradient(135deg, #E8F0EB 0%, #EAF0F8 100%);
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-right: 1px solid var(--border);
  }

  .auth-left-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 2rem;
  }

  .logo-mark {
    width: 50px;
    height: 50px;
    background: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-mark svg { width: 26px; height: 26px; }

  .logo-text {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .auth-left-content {
    margin-top: 1rem;
  }

  .auth-left h2 {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1rem;
    letter-spacing: -0.01em;
  }

  .auth-left p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    max-width: 280px;
  }

  .auth-left-icon {
    width: 120px;
    height: 120px;
    background: rgba(45, 90, 61, 0.1);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2rem auto 1rem;
  }

  .auth-left-icon svg {
    width: 60px;
    height: 60px;
    color: var(--accent);
  }

  /* RIGHT SIDE - FORM */
  .auth-right {
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .auth-form-wrapper {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .auth-toggle {
    display: flex;
    gap: 8px;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 1.5rem;
  }

  .toggle-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .toggle-btn.active {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .auth-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.25rem;
    letter-spacing: -0.01em;
  }

  .auth-subtitle {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 1.5rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
  }

  .form-input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(45, 90, 61, 0.08);
  }

  .form-input::placeholder {
    color: var(--text-3);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-group.hidden {
    display: none;
  }

  .form-group.hidden.show {
    display: flex;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
  }

  .checkbox-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .checkbox-group a {
    color: var(--accent);
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .checkbox-group a:hover {
    opacity: 0.8;
  }

  .btn-primary {
    padding: 12px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    width: 100%;
    margin-top: 0.5rem;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1rem 0;
    color: var(--text-3);
    font-size: 12px;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .btn-social {
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-social:hover {
    background: var(--border);
  }

  .auth-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
    margin-top: 1rem;
  }

  .auth-footer button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    padding: 0;
    transition: opacity 0.15s;
    text-decoration: none;
  }

  .auth-footer button:hover {
    opacity: 0.8;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .auth-wrapper {
      grid-template-columns: 1fr;
    }

    .auth-left {
      display: none;
    }

    .auth-right {
      padding: 2rem 1.5rem;
    }

    .auth-title {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<div class="auth-wrapper">

  <!-- LEFT SIDE -->
  <div class="auth-left">
    <div class="auth-left-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.8"><path d="M8 14s-6-4-6-8a6 6 0 0 1 12 0c0 4-6 8-6 8z"/></svg>
      </div>
      <span class="logo-text">Wishly</span>
    </div>

    <div class="auth-left-content">
      <h2>Bienvenue!</h2>
      <p>Créez votre liste de souhaits personnelle et partagez vos envies avec vos amis.</p>
      <div class="auth-left-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="auth-right">
    <div class="auth-form-wrapper">

      <!-- TOGGLE LOGIN/REGISTER -->
      <div class="auth-toggle">
        <button class="toggle-btn " data-mode="login">Connexion</button>
        <button class="toggle-btn active" data-mode="register">Inscription</button>
      </div>


      <!-- REGISTER FORM -->
      <div class="auth-mode" data-mode="register">
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-subtitle">Rejoignez la communauté Wishly</p>

        <form class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Prénom</label>
              <input type="text" class="form-input" placeholder="Jean" required>
            </div>
            <div class="form-group">
              <label class="form-label">Nom</label>
              <input type="text" class="form-input" placeholder="Dupont" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Adresse email</label>
            <input type="email" class="form-input" placeholder="vous@exemple.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-input" placeholder="Minimum 8 caractères" required>
          </div>

          <div class="form-group">
            <label class="form-label">Confirmer le mot de passe</label>
            <input type="password" class="form-input" placeholder="••••••••" required>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">J'accepte les <button type="button" onclick="showTerms()">conditions d'utilisation</button></label>
          </div>

          <button type="submit" class="btn-primary">Créer mon compte</button>
        </form>

        <div class="auth-divider">ou</div>

        <button class="btn-social" onclick="handleGoogleSignup()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#4285F4" opacity="0.1"/></svg>
          S'inscrire avec Google
        </button>
      </div>

    </div>
  </div>

</div>

<script>
  // Toggle between login and register
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const mode = e.target.dataset.mode;

      // Update buttons
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      // Update forms
      document.querySelectorAll('.auth-mode').forEach(form => {
        form.classList.add('hidden');
        form.classList.remove('show');
      });

      const activeForm = document.querySelector(`[data-mode="${mode}"]`);
      activeForm.classList.remove('hidden');
      activeForm.classList.add('show');
    });
  });

  // Handle login
  function handleLogin(e) {
    e.preventDefault();
    alert('Connexion en cours...\n\nCeci est une démo. Intégrez votre backend ici.');
    console.log('Login form submitted');
  }

  // Handle register
  function handleRegister(e) {
    e.preventDefault();
    alert('Inscription en cours...\n\nCeci est une démo. Intégrez votre backend ici.');
    console.log('Register form submitted');
  }

  // Social login handlers
  function handleGoogleLogin() {
    alert('Redirection vers Google...\n\nCeci est une démo.');
  }

  function handleGoogleSignup() {
    alert('Redirection vers Google...\n\nCeci est une démo.');
  }

  function showPasswordReset() {
    alert('Accédez à la page de réinitialisation du mot de passe.');
  }

  function showTerms() {
    alert('Afficher les conditions d\'utilisation.');
  }
</script>

</body>
</html>
